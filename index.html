@media(max-width:560px){.db-top{grid-template-columns:1fr;justify-items:center}.db-kpi{width:100%}.db-sum{grid-template-columns:38px 1fr}.db-sum::after{display:none}.db-sum .db-pill{grid-column:2}}

<script>
/*CONFIG*/
const CONFIG = {
  endpoint: 'https://script.google.com/macros/s/AKfycbwqkz7-Y_wKe6jHYf6k5mWEiPeeZAmrx9l_e-jwmtdeuOHP_piZnNzBZFrkSx3SYtf7/exec',            // indirizzo del servizio che raccoglie le risposte (vuoto = modalità prova, dati solo su questo dispositivo)
  statsKey: 'docente',     // chiave per la pagina statistiche (in modalità prova); con un servizio la verifica la fa il servizio
  appVersion: 1
};
/*DATA*/
const TESTS = [{"key":"BGV","title":"Test finale","modulo":"Le due giornate","durata":"10-12 minuti","q":[{"id":"G1-01","modulo":"Ruolo del direttore","t":"single","text":"Nella riflessione sul ruolo, qual è la missione del responsabile di filiale di una BCC?","why":"La missione ha tre pilastri: creare valore (risultati sostenibili per la banca e per il territorio), servire la comunità (soci, clienti, valori cooperativi) e sviluppare le persone (far crescere e motivare il team).","src":"Giorno 1 · Riflessione sul ruolo del direttore","opts":["Vendere il maggior numero possibile di prodotti, qualunque sia il rischio","Guidare la filiale verso risultati economici, commerciali e di qualità del servizio, valorizzando le persone e la fiducia di soci e clienti","Eseguire in prima persona le attività più delicate, così da evitare errori","Applicare le procedure e riferire alla direzione, lasciando le decisioni ad altri"],"a":1,"wy":{"opt":["Sbagliata: i volumi da soli non bastano. La missione tiene insieme risultati, qualità del servizio e fiducia di soci e clienti, e il rischio va presidiato.","Giusta: guidare la filiale verso i risultati valorizzando le persone e la fiducia di soci e clienti. Sono i tre pilastri: creare valore, servire la comunità, sviluppare le persone.","Sbagliata: fare tutto in prima persona è proprio il contrario di guidare. Il direttore ottiene i risultati attraverso il team.","Sbagliata: il direttore decide, risponde del risultato e guida il team. Non è solo un anello di trasmissione."],"trap":"Ridurre il ruolo a una sola dimensione, le vendite o l'esecuzione, e dimenticare che il direttore ottiene i risultati attraverso le persone."}},{"id":"BG-01","modulo":"Banking Game · lettura dei risultati","t":"form","text":"Leggi il rendiconto trimestrale di una filiale e completa la cascata. Margine ante rettifiche − perdita attesa + premio di liquidità = MINT post rettifiche. MINT post rettifiche − spese del personale − costi diretti = risultato operativo. Scrivi i valori in euro, senza decimali.","table":{"head":["Voce","Euro a trimestre"],"rows":[["Interessi sugli impieghi","400.000"],["Interessi sulla raccolta diretta","−40.000"],["Commissioni sulla raccolta indiretta","60.000"],["Ricavi da servizi","180.000"],["Perdita attesa","−130.000"],["Premio di liquidità","20.000"],["Spese del personale","−250.000"],["Costi diretti","−100.000"],["Dipendenti","10"]]},"fields":[{"l":"MINT post rettifiche (€)","k":"num","a":490000},{"l":"Risultato operativo (€)","k":"num","a":140000},{"l":"Risultato operativo per dipendente (€)","k":"num","a":14000}],"why":"Interessi, commissioni e servizi sommano il margine ante rettifiche (400.000 − 40.000 + 60.000 + 180.000 = 600.000). Tolta la perdita attesa e aggiunto il premio di liquidità si arriva al MINT post rettifiche (600.000 − 130.000 + 20.000 = 490.000). Tolti personale e costi diretti c'è il risultato operativo (490.000 − 250.000 − 100.000 = 140.000), che diviso per 10 dipendenti dà 14.000 €. Il «margine» è un ricavo, non un profitto: il profitto è il risultato operativo.","src":"Rendiconto del Banking Game, tutti i round","wy":{"field":["600.000 − 130.000 + 20.000 = 490.000. Errore tipico: dimenticare il premio di liquidità, o sommare la perdita attesa invece di toglierla.","490.000 − 250.000 − 100.000 = 140.000. Errore tipico: fermarsi al MINT, che è un ricavo, e dimenticare spese del personale e costi diretti.","140.000 ÷ 10 dipendenti = 14.000. È il valore da confrontare con il target di 50.000 € per addetto."],"trap":"Scambiare i margini, che sono ricavi, per il risultato: i costi del personale e i costi diretti vanno tolti prima di parlare di profitto."}},{"id":"BG-02","modulo":"Banking Game · lettura dei risultati","t":"single","text":"Una filiale porta i tassi pagati ai clienti VIP sulla raccolta a scadenza dallo 0,6% all'1,6%, circa un punto sopra il TIT. La raccolta diretta cresce di oltre 20 milioni. Che cosa mostra il rendiconto?","why":"In un debriefing una filiale ha portato la raccolta diretta da 18 a 41 milioni pagando i VIP all'1,6%: −68.640 € di interessi in un trimestre. Il premio di liquidità (56.618 €) ha compensato quasi tutto, ma a fine trimestre i saldi erano 40,9 milioni contro una media di 29,6: a tassi invariati il trimestre dopo costa circa 26.000 € in più.","src":"Debriefing dei round 1 e 2","opts":["Un margine più alto: più raccolta significa più guadagno","Più volumi ma interessi sulla raccolta fortemente negativi: il prezzo ha comprato la raccolta e il conto arriva dopo, perché i saldi di fine trimestre sono più alti della media","Nessun effetto sul rendiconto: il TIT compensa la differenza","Una perdita attesa più bassa, perché i clienti VIP sono poco rischiosi"],"a":1,"wy":{"opt":["Sbagliata: i volumi crescono ma ogni punto pagato sopra il TIT riduce la contribuzione. Nel debriefing il margine è sceso.","Giusta: la contribuzione è negativa (si paga più del TIT), il premio di liquidità compensa in parte e il costo del trimestre dopo cresce perché i saldi di fine trimestre superano la media.","Sbagliata: il TIT è il riferimento interno. Pagare di più del TIT vuol dire guadagnare di meno sulla raccolta.","Sbagliata: il rischio dei clienti non c'entra con il prezzo pagato sulla raccolta."],"trap":"Guardare solo i volumi di raccolta e non il costo che il prezzo scarica sul conto economico di questo trimestre e dei successivi."}},{"id":"BG-03","modulo":"Banking Game · lettura dei risultati","t":"single","text":"Una filiale ha 13,8 milioni di impieghi sulle Medie imprese con rischio assunto al 10%: valgono circa 81.000 € di perdita attesa a trimestre, il 56% del totale. Quale decisione la riduce di più?","why":"La perdita attesa è circa volume × rischio assunto. Con 13,8 milioni ogni punto di rischio in meno vale circa 8.100 € a trimestre: scendere dal 10% al 6-7% vale circa 24.000-32.000 €. I tassi più alti aumentano il margine ma non riducono la perdita.","src":"Debriefing del round 2","opts":["Abbassare il rischio assunto su quel segmento, per esempio al 6-7%","Alzare i tassi sugli impieghi alle Medie imprese","Dedicare più tempo commerciale alle Medie imprese","Aumentare gli straordinari del personale"],"a":0,"wy":{"opt":["Giusta: è la leva diretta. La perdita attesa dipende dal volume per il rischio assunto su ciascun segmento.","Sbagliata: alzare il tasso aumenta il margine, ma la perdita attesa resta la stessa.","Sbagliata: più tempo significa in genere più volumi sul segmento, quindi più perdita.","Sbagliata: gli straordinari danno più tempo commerciale e riducono la produttività, ma non cambiano il rischio assunto."],"trap":"Cercare di ridurre le perdite con il prezzo o con il tempo, invece che con la quota di rischio accettata sul segmento."}},{"id":"BG-04","modulo":"Banking Game · decisioni e piano","t":"match","text":"Abbina ogni decisione alla voce del rendiconto dove se ne vede l'effetto.","why":"Ogni decisione ha una voce in cui compare l'effetto: i prezzi dei servizi nei ricavi da servizi, il rischio assunto nella perdita attesa, la formazione nell'indice di competenza, i tassi pagati sulla raccolta nei suoi interessi.","src":"Cruscotto decisionale e rendiconto del Banking Game","items":["Alzare i prezzi dei servizi entro la banda del ±20%","Ridurre il rischio assunto sulle Medie imprese","Aumentare le ore di formazione sui prodotti di raccolta","Remunerare la raccolta sopra il TIT"],"cats":["Ricavi da servizi","Interessi sulla raccolta diretta","Competenza media sulla raccolta","Perdita attesa"],"a":[0,3,2,1],"wy":{"item":["I prezzi dei servizi muovono i ricavi da servizi. La banda è ±20% e nessuno ha superato +5%: ogni punto vale circa 1.900 € a trimestre, è la leva più inutilizzata.","Il rischio assunto muove la perdita attesa, che è circa volume per rischio: 10% su 13,8 milioni di Medie imprese pesano 81.000 € a trimestre.","La formazione alza l'indice di competenza sulla raccolta, che vale il 20% del punteggio. Costa subito (300 € per ora mensile) e ripaga dal round dopo.","Pagare i clienti sopra il TIT rende negativa la contribuzione da interessi della raccolta diretta."],"trap":"Aspettarsi l'effetto di una decisione sulla voce sbagliata, per esempio pensare che la formazione riduca subito i costi o che il tempo commerciale riduca la perdita attesa."}},{"id":"G1-02","modulo":"Tempo e priorità","t":"single","text":"Nella matrice di Eisenhower, che cosa si fa con un'attività importante ma non urgente?","why":"Importante e urgente: si fa subito. Importante ma non urgente: si pianifica. Urgente ma poco importante: si delega o si riduce. Né urgente né importante: si elimina. Nella «settimana infernale» la difficoltà è proprio non confondere urgenza e priorità.","src":"Giorno 1 · La matrice di Eisenhower e «La settimana infernale»","opts":["Si fa subito, prima di tutto il resto","Si pianifica: si decide quando farla, prima che diventi urgente","Si delega sempre","Si elimina"],"a":1,"wy":{"opt":["Sbagliata: «subito» è per ciò che è importante e anche urgente. Se tutto si fa subito si finisce a rincorrere le urgenze.","Giusta: ciò che è importante e non urgente si pianifica in agenda, così non diventa un'emergenza.","Sbagliata: si delega ciò che è urgente ma poco importante. Un'attività importante spesso richiede il vostro presidio.","Sbagliata: si elimina ciò che non è né urgente né importante."],"trap":"Confondere urgenza e importanza e lasciare che le urgenze occupino tutto il tempo delle attività davvero importanti."}},{"id":"BG-05","modulo":"Banking Game · decisioni e piano","t":"single","text":"Una filiale dedica molto tempo commerciale a vendere gestioni patrimoniali, fondi e polizze vita alle imprese. Che cosa dice il modello?","why":"Il piano commerciale ripartisce il tempo tra prodotti e segmenti: cosa vendo, a chi, con quale tempo. Nei debriefing tre team su quattro hanno dedicato tempo a raccolta gestita verso le imprese, che per struttura non le acquistano: sforzo da reindirizzare. Concentrare le decisioni sulle leve rilevanti è già un vantaggio.","src":"Debriefing del round 1","opts":["È un buon investimento: più prodotti proposti significano più commissioni","È tempo sprecato: per struttura le imprese non acquistano quei prodotti. Il tempo va spostato sui segmenti che li comprano, cioè i privati, o su prodotti adatti alle imprese","È neutro: il tempo commerciale non influisce sui volumi","Serve soltanto più formazione sui prodotti"],"a":1,"wy":{"opt":["Sbagliata: se il segmento non acquista quei prodotti, le commissioni non arrivano.","Giusta: il tempo va sui segmenti che comprano quel prodotto. Qui è sforzo da reindirizzare.","Sbagliata: il tempo commerciale è la leva con cui si producono i volumi, ma solo se è messo sul segmento giusto.","Sbagliata: la formazione non cambia il fatto che quel segmento non acquista quei prodotti."],"trap":"Distribuire il tempo commerciale su tutti i prodotti e segmenti senza chiedersi chi li compra davvero."}},{"id":"PL-01","modulo":"Pianificazione e programmazione","t":"single","text":"In che cosa consiste il «reverse planning» usato per costruire la strategia nel Banking Game?","why":"Si parte dal traguardo (gli obiettivi del round 4) e si torna indietro round per round, definendo target intermedi realistici e al massimo tre leve decisionali per ciascuno, partendo dai numeri reali di oggi.","src":"Giorno 1 · Esercizio sulla strategia (reverse planning)","opts":["Si parte dai risultati del primo round e si proietta il trend fino alla fine","Si parte dall'obiettivo del round 4 e si torna indietro, definendo target intermedi e leve decisionali per ogni round","Si pianifica solo il round successivo, per non sbagliare previsione","Si copia la strategia del team in testa alla classifica"],"a":1,"wy":{"opt":["Sbagliata: proiettare il trend è il contrario. Si parte dal traguardo e si torna indietro.","Giusta: dal round 4 al round 2, con target intermedi e leve decisionali per ogni round.","Sbagliata: guardare un solo round alla volta fa perdere la direzione verso l'obiettivo finale.","Sbagliata: copiare non è una strategia, e la vostra filiale ha un punto di partenza diverso."],"trap":"Costruire il piano guardando in avanti dal presente, invece di partire dal risultato da raggiungere."}},{"id":"BG-06","modulo":"Banking Game · decisioni e piano","t":"single","text":"Una filiale ha quasi chiuso l'obiettivo sulla raccolta (mancano 0,8 milioni su 66,7) ma dedica ancora il 39% del tempo commerciale alla raccolta diretta, pagando tassi alti. Che cosa conviene pianificare per il round successivo?","why":"Un obiettivo chiuso va lasciato: il punteggio non premia l'eccesso. Il tempo e il prezzo liberati vanno dove il gap è più grande e più pesante. Nel debriefing, portare i VIP dall'1,6% all'1,2% valeva circa 16.000 € a trimestre.","src":"Debriefing del round 2","opts":["Insistere: ogni milione di raccolta in più aggiunge punti","Riallocare il tempo commerciale e ridurre i tassi pagati, concentrando le risorse sugli obiettivi lontani, come il risultato operativo per addetto (30%)","Azzerare il tempo commerciale su tutti i prodotti","Alzare ancora i tassi per chiudere l'obiettivo con certezza"],"a":1,"wy":{"opt":["Sbagliata: oltre il target il punteggio non cresce e si continua a pagare il prezzo della raccolta.","Giusta: si sposta tempo e prezzo sugli obiettivi che pesano di più e sono lontani. Pianificare è scegliere dove mettere risorse limitate.","Sbagliata: senza tempo commerciale i volumi crollano e anche gli altri obiettivi ne risentono.","Sbagliata: altri tassi alti aumentano il costo senza aggiungere punti all'obiettivo."],"trap":"Continuare a spingere dove si è già vicini al target, invece di spostare le risorse sugli obiettivi più pesanti e più lontani."}},{"id":"BG-07","modulo":"Banking Game · decisioni e piano","t":"single","text":"Con 11 dipendenti l'obiettivo di 50.000 € per addetto vale 550.000 € di risultato operativo. Una filiale decide nel Q2 di assumere un dodicesimo collaboratore senior. Che cosa succede?","why":"L'obiettivo è per dipendente: con 12 persone il risultato operativo da raggiungere sale a 600.000 €. Ogni persona ha un costo che dipende dalla seniority, e le decisioni sul personale agiscono con un round di ritardo, quindi vanno programmate prima. Ogni assunzione abbassa il risultato per addetto a parità di risultato.","src":"Debriefing dei round 1 e 2","opts":["Il target non cambia: resta 550.000 € di risultato operativo","Dal Q3 il target complessivo sale a 600.000 € e le spese del personale aumentano: l'assunzione si giustifica solo se il nuovo ingresso produce ricavi sufficienti, e va pianificata in anticipo","L'effetto è immediato, già nel Q2","Le spese del personale scendono, perché il carico si distribuisce"],"a":1,"wy":{"opt":["Sbagliata: il target è per dipendente. Con più persone il risultato complessivo richiesto sale.","Giusta: 12 × 50.000 = 600.000 €, con costi più alti. Vale la pena solo se il nuovo ingresso rende più di quanto costa, e dà un compito concreto.","Sbagliata: i movimenti decisi in un round hanno effetto dal round successivo.","Sbagliata: una persona in più è un costo in più, tanto più alto quanto più è senior."],"trap":"Trattare l'assunzione come una soluzione al carico di lavoro, senza vedere che cambia il target per addetto e i costi, con un round di ritardo."}},{"id":"BG-08","modulo":"Banking Game · decisioni e piano","t":"single","text":"Una filiale investe circa 198.000 € in ore di formazione sulla raccolta nel primo round. Quando e dove ne vede il ritorno?","why":"La formazione costa subito e ripaga dopo: pesa sul round in cui si fa (circa 300 € per ora mensile e persone improduttive durante le ore), mentre l'effetto sulle competenze si misura dal round dopo. Chi investe prima accumula un vantaggio sull'obiettivo da 20%.","src":"Debriefing dei round 1 e 2","opts":["Subito, nel risultato operativo del primo round","Pesa sul primo round, perché costa e le persone non producono durante le ore; il ritorno si misura dai round successivi sull'indice di competenza della raccolta, che vale il 20%","Mai: nel modello la formazione non cambia le competenze","Solo sul risultato per addetto, e solo se non si assumono persone"],"a":1,"wy":{"opt":["Sbagliata: il primo round ne porta il costo. Il ritorno è nei round dopo.","Giusta: costo subito, ritorno sulle competenze dal round successivo. Programmare la formazione presto dà più round per raccogliere.","Sbagliata: nei debriefing la competenza sulla raccolta è salita di circa un punto in un round per chi ha fatto formazione.","Sbagliata: gli effetti sono su competenze e ricavi, non una scelta alternativa all'organico."],"trap":"Giudicare la formazione sul risultato del trimestre in cui si fa, dimenticando che è un investimento il cui ritorno arriva dopo."}},{"id":"G2-01","modulo":"Pianificazione e programmazione","t":"single","text":"Alla filiale di Brisighella le attività sono già avviate e non modificabili. Come conviene distribuire il tempo di Mario (esperto di finanza) e di Luigi (portato alla vendita)?","why":"La pianificazione operativa mette il tempo dove rende di più: sulle attività che chiudono i gap maggiori e dove la persona ha la competenza giusta. Nell'app dell'esercizio il tempo diviso in parti uguali prende 61 su 100 e i ruoli invertiti 25.","src":"Giorno 2 · Esercitazione di pianificazione, La filiale di Brisighella","opts":["Dividere il tempo in parti uguali tra tutte le attività","Mario sulle attività tecniche (profilatura, previdenza, amministrata) e Luigi su quelle commerciali (conti, obbligazioni, polizze), pesando ogni attività sul gap che può chiudere","Invertire i ruoli, così ciascuno impara qualcosa di nuovo","Concentrare tutto il tempo di entrambi sull'attività con il gap più grande"],"a":1,"wy":{"opt":["Sbagliata: parti uguali ignorano sia i gap (alcuni sono molto più grandi di altri) sia le competenze delle due persone.","Giusta: si guarda ogni attività in base al gap che può ridurre e si affida a chi la sa fare meglio.","Sbagliata: invertire i ruoli spreca la competenza: Mario è l'esperto tecnico, Luigi è bravo a vendere.","Sbagliata: concentrare tutto su una sola attività fa cadere i rendimenti: i primi giorni rendono molto, i successivi sempre meno."],"trap":"Distribuire il tempo senza guardare né l'ampiezza dei gap né le competenze delle persone."}},{"id":"PL-03","modulo":"Pianificazione e programmazione","t":"single","text":"Una filiale pianifica di spostare il tempo commerciale dalla raccolta agli impieghi. Che cosa trasforma questa scelta in programmazione?","why":"La pianificazione dice dove mettere tempo e risorse per raggiungere gli obiettivi. La programmazione la porta nell'agenda: attività, date, responsabili e verifiche. È il passaggio chiesto al direttore («riempire la propria agenda di attività pianificate e supportare i collaboratori a fare lo stesso»), ed è la logica del PPA.","src":"Giorno 1 · Ruolo del direttore; Giorno 2 · PPA","opts":["Annunciarla al team in una riunione","Tradurla in attività concrete con date e responsabili, inserite nell'agenda di ciascuno, e verificare periodicamente che vengano fatte","Fissare un obiettivo più alto","Aspettare i risultati del round e poi decidere"],"a":1,"wy":{"opt":["Sbagliata: annunciare non programma nulla. Senza attività, date e responsabili il piano resta un'intenzione.","Giusta: attività concrete, date, responsabili, agenda e verifica. È il passaggio dal piano all'azione.","Sbagliata: un obiettivo più alto non è un programma di lavoro.","Sbagliata: aspettare i risultati è reagire, non programmare."],"trap":"Fermarsi alla decisione di cosa fare senza stabilire chi fa cosa, quando e come si verifica."}},{"id":"G2-02","modulo":"Delega","t":"multi","text":"Quali di queste sono tra le ragioni che, secondo le ricerche viste in aula, impediscono ai responsabili di delegare?","why":"Le ricerche indicano dieci ragioni ricorrenti: tra queste, il tempo che serve per spiegare e controllare, l'abitudine di fare da soli e il giudizio che il collaboratore non sia all'altezza. Il regolamento non c'entra.","src":"Giorno 2 · Gli ostacoli alla delega, sl. 3","opts":["Delegare porta via tempo","Ce l'ho sempre fatta da solo","Lui o lei non è all'altezza, non è maturo","Il regolamento di filiale vieta di delegare","I collaboratori hanno già troppo tempo libero"],"a":[0,1,2],"wy":{"opt":["Giusta: è un ostacolo classico. Spiegare e controllare richiede tempo all'inizio, ma poi libera più tempo di quanto ne costi.","Giusta: l'abitudine di fare da soli porta a pensare di non averne bisogno e a continuare così.","Giusta: spesso è un giudizio più che un fatto. Giuseppe, nel caso visto, non ha mai dato a Dino la possibilità di dimostrarlo.","Sbagliata: non è tra le ragioni emerse dalle ricerche. Non c'è un divieto: è una scelta del responsabile.","Sbagliata: non è una ragione tipica. Anzi, chi non delega tende a sovraccaricare sé stesso."],"trap":"Cercare l'ostacolo fuori (regole, carichi) quando le ricerche mostrano che nascono quasi sempre dalle abitudini e dai timori del responsabile."}},{"id":"G2-03","modulo":"Delega","t":"single","text":"Nel caso di Giuseppe, che rilegge e riscrive le istruttorie preparate da Dino, che cosa dovrebbe fare per mettere Dino in condizione di lavorare da solo?","why":"Delegare significa scomporre il compito, dare istruzioni chiare e tempo, garantire la preparazione e concordare come verificare. Rifare il lavoro dopo ogni errore toglie a Dino la possibilità di crescere, e a Giuseppe il tempo per il resto del suo ruolo.","src":"Giorno 2 · Il caso di Giuseppe e autotest sulla delega","opts":["Aspettare di sentirsi più sicuro nel proprio ruolo e poi cominciare a delegare","Continuare a rifare le istruttorie, così in delibera non arrivano errori","Affidare a Dino le istruttorie con istruzioni chiare, tempo sufficiente e verifiche concordate, lasciandogli imparare dai propri errori senza riprendere il lavoro","Togliere a Dino le istruttorie, visto che non ha mai gestito pratiche importanti"],"a":2,"wy":{"opt":["Sbagliata: rimandare mantiene il problema. Più Giuseppe aspetta, più carico accumula e più Dino smette di chiedere.","Sbagliata: così il carico di Giuseppe cresce e Dino non impara. Il rischio che sembra evitato si ripresenta ogni volta.","Giusta: istruzioni, tempo, verifiche e spazio per imparare. È la strada per far lavorare Dino da solo.","Sbagliata: togliere l'incarico conferma la sfiducia. Dino è in filiale da tre anni, ha fatto i corsi sul credito ed è preciso."],"trap":"Credere che per non sbagliare convenga fare tutto da soli, senza vedere che il costo è nel carico del responsabile e nella crescita del collaboratore."}},{"id":"G2-04","modulo":"Obiettivi SMART e PPA","t":"multi","text":"«Aumentare la raccolta diretta della filiale dello 0,2%.» Quali caratteristiche SMART non sono soddisfatte?","why":"L'obiettivo è specifico e misurabile (c'è un numero), ma non è ambizioso (0,2% è quasi il livello naturale) e non ha una scadenza. Ha senso solo se ha una data e chiede uno sforzo in più rispetto all'andamento normale.","src":"Giorno 2 · Esercitazione sugli obiettivi del collaboratore","opts":["S – Specifico","M – Misurabile","A – Ambizioso","R – Raggiungibile","T – Tempificato"],"a":[2,4],"wy":{"opt":["Soddisfatta: dice cosa aumentare, la raccolta diretta di filiale.","Soddisfatta: c'è un parametro numerico, lo 0,2%.","Non soddisfatta: lo 0,2% è un obiettivo irrisorio, non chiede uno sforzo in più rispetto all'andamento naturale.","Soddisfatta: aumentare dello 0,2% è realistico, anche troppo.","Non soddisfatta: manca la scadenza: entro quando?"],"trap":"Giudicare un obiettivo SMART solo perché ha un numero, senza controllare se è sfidante e se ha una data."}}]}];
const GLOSS = {"TIT":"tasso interno di trasferimento: il tasso con cui la banca remunera la raccolta e addebita gli impieghi alle filiali","MINT":"margine di intermediazione: interessi, commissioni e ricavi da servizi (è un ricavo, non un profitto)","PPA":"Piano Personale di Azione: il documento in cui ciascuno trasforma i temi del corso in impegni concreti","SMART":"Specifico, Misurabile, Ambizioso, Raggiungibile, Tempificato: le cinque caratteristiche di un obiettivo ben definito","Q1":"primo trimestre, primo round del gioco","Q2":"secondo trimestre, secondo round del gioco","Q3":"terzo trimestre, terzo round del gioco"};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
/* ---------- stato ---------- */
let S = { edition: '', pid: '', view: 'home', test: null, qi: 0, filter: 'bad', statsTest: TESTS.length > 1 ? -1 : 0, key: '' };
let DB = { answers: {}, done: {} };   // risposte in corso e test consegnati, per edizione+partecipante
const dbKey = () => 'bgv:' + S.edition + ':' + S.pid;
const saveDB = () => LS.set(dbKey(), DB);
function rnd4() { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(n, seedStr, notIdentity) {
  const idx = [...Array(n).keys()], r = rng(hash(seedStr));
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  if (notIdentity && n > 1 && idx.every((v, i) => v === i)) [idx[0], idx[1]] = [idx[1], idx[0]];
  return idx;
}
const perm = (q, n) => q.fixed ? [...Array(n).keys()] : shuffled(n, S.pid + q.id);
/* ---------- risposte ---------- */
const getA = (q) => (DB.answers[S.test] || {})[q.id];
function setA(q, v) { (DB.answers[S.test] = DB.answers[S.test] || {})[q.id] = v; saveDB(); }
function answered(q) {
  const a = getA(q);
  if (a === undefined || a === null) return false;
  if (q.t === 'single') return typeof a === 'number';
  if (q.t === 'multi') return a.length > 0;

const tone = (pw) => (pw >= .5 ? 'hi' : pw >= .25 ? 'mid' : 'lo');
