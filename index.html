<style>

.db-sumt{font-size:16px;line-height:1.35}
.db-pill{font-weight:700;font-size:13px;border-radius:99px;padding:4px 12px;white-space:nowrap}.db-pill.hi{background:var(--ko-bg);color:#7a2a21}.db-pill.mid{background:#fff3cd;color:#5c4400}.db-pill.lo{background:var(--ok-bg);color:#1d5233}
.db-body{padding:0 16px 16px}.db-q{font-size:17px;font-weight:700;margin:2px 0 12px;line-height:1.4}

.db-ot{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start;font-size:15px}.db-mk{font-weight:700}.db-opt.g .db-mk{color:var(--green)}.db-opt.r .db-mk{color:var(--red)}
.db-cn{font-size:13px;font-weight:700;color:#333;text-align:right}

.db-ob{height:8px;background:#eceef1;border-radius:4px;overflow:hidden;margin:8px 0 2px}.db-ob span{display:block;height:100%}.db-ob.br span{background:var(--red)}.db-ob.bg span{background:var(--green)}
.db-opt.g .db-ob span{background:var(--green)}
.db-ow{margin:6px 0 0;font-size:14px;color:#222;line-height:1.45}
.db-ok{background:var(--ok-bg);border-left:6px solid var(--green);border-radius:10px;padding:10px 14px;margin-top:12px}.db-ok p{margin:4px 0 0;font-size:15px}
.db-trap{background:#fff3cd;border-left:6px solid #c58b00;border-radius:10px;padding:10px 14px;margin-top:10px}.db-trap p{margin:4px 0 0;font-size:15px;color:#4a3800}
.db-gq{padding:8px 0;border-bottom:1px solid var(--grey);font-size:15px}
@media(max-width:560px){.db-top{grid-template-columns:1fr;justify-items:center}.db-kpi{width:100%}.db-sum{grid-template-columns:38px 1fr}.db-sum::after{display:none}.db-sum .db-pill{grid-column:2}}

<script>
/*CONFIG*/
const CONFIG = {
  endpoint: 'https://script.google.com/macros/s/AKfycbwqkz7-Y_wKe6jHYf6k5mWEiPeeZAmrx9l_e-jwmtdeuOHP_piZnNzBZFrkSx3SYtf7/exec',            // indirizzo del servizio che raccoglie le risposte (vuoto = modalità prova, dati solo su questo dispositivo)
  statsKey: 'docente',     // chiave per la pagina statistiche (in modalità prova); con un servizio la verifica la fa il servizio
  appVersion: 1
};
/*DATA*/
const TESTS = [{"key":"BGV","title":"Test finale","modulo":"Le due giornate","durata":"10-12 minuti","q":[{"id":"M-01","modulo":"Modello gestionale della filiale","t":"single","text":"Come posso migliorare il reddito operativo della filiale?","why":"Il reddito operativo nasce da ricavi (margine da interessi, da commissioni, da servizi), meno perdite attese, più premio di liquidità, meno costi diretti. Nessuna leva basta da sola: i volumi comprati con il prezzo erodono il margine, tagliare i costi riduce la capacità commerciale, alzare i prezzi sposta i clienti verso altre banche. Il risultato si migliora tenendo insieme ricavi, rischio e produttività.","src":"Banking Game: modello gestionale e debriefing dei round","opts":["Puntando soprattutto sulla crescita dei volumi di raccolta e di impieghi, perché più masse significano più margine e più clienti da servire con le stesse persone","Agendo insieme su ricavi (mix di prodotti e segmenti, tassi, commissioni, servizi), rischio di credito e produttività delle persone rispetto ai costi","Riducendo i costi del personale e i costi diretti, che sono la leva più rapida, più certa e quella che controllo meglio direttamente","Alzando i prezzi su tutta la clientela, perché ogni punto di tasso o di commissione in più va direttamente a risultato, senza altri costi"],"a":1,"wy":{"opt":["Incompleta: i volumi aiutano solo se il margine unitario regge. Una raccolta pagata troppo o impieghi su clientela più rischiosa fanno crescere le masse e peggiorano il risultato.","Giusta: il reddito dipende da come si guadagna (prezzo e mix), da quanto rischio si prende e da quanto rendono le persone rispetto a ciò che costano.","Incompleta: tagliare costi dà un beneficio rapido ma limitato, e se riduce persone, formazione e tempo commerciale compromette i ricavi dei periodi successivi.","Sbagliata come regola generale: i clienti reagiscono al prezzo e la concorrenza tra banche è immediata. Un aumento indiscriminato fa perdere volumi e clienti."],"trap":"Cercare una leva unica, volumi, costi o prezzi, invece di leggere insieme ricavi, rischio e produttività."}},{"id":"M-02","modulo":"Modello gestionale della filiale","t":"single","text":"Come posso modificare il profilo di competenza della filiale?","why":"Il profilo di competenza della filiale è la somma dei profili delle persone, per prodotto e per cliente. Si modifica con la formazione, che costa subito e ripaga dopo, con l'affiancamento, e con l'inserimento di persone esperte, che però costano di più e agiscono con ritardo. La scelta parte dal mix di prodotti e clienti coerente con gli obiettivi della banca.","src":"Banking Game: modello gestionale e debriefing dei round","opts":["Con la formazione d'aula per tutti, che è la leva più diretta e più semplice da gestire per alzare in modo uniforme le competenze della filiale in tempi brevi","Combinando formazione mirata, affiancamento sul campo e inserimento di persone esperte, in funzione del mix di prodotti e clienti coerente con gli obiettivi della banca","Sostituendo gradualmente le persone meno esperte con collaboratori più senior, che portano subito competenze già formate e riducono i tempi di crescita della filiale","Assegnando a ciascuno i clienti e i prodotti in cui è già forte, così la filiale rende al meglio con le competenze che ha, senza dover sostenere costi di formazione"],"a":1,"wy":{"opt":["Incompleta: la formazione toglie tempo produttivo, ha effetto dopo e da sola non porta l'esperienza che si costruisce sul campo.","Giusta: le leve si combinano e si scelgono in funzione del mix di prodotti e clienti coerente con gli obiettivi della banca. Costi ed effetti arrivano in tempi diversi.","Incompleta: l'inserimento di senior alza le competenze ma aumenta i costi del personale e agisce con ritardo. Da solo non sviluppa chi c'è già.","Sbagliata come risposta alla domanda: ottimizza il profilo esistente ma non lo cambia. Può essere un buon criterio di assegnazione, non una strategia di sviluppo."],"trap":"Pensare che il profilo di competenza si cambi con un solo strumento, invece di combinare formazione, affiancamento e inserimenti secondo gli obiettivi."}},{"id":"M-03","modulo":"Modello gestionale della filiale","t":"single","text":"Che cosa misura il rapporto cost/income e come posso intervenire su di esso?","why":"Il cost/income dice quanta parte dei ricavi è assorbita dai costi operativi. Si riduce dal lato dei costi ma anche dal lato dei ricavi: più ricavi per addetto, con le stesse persone e gli stessi costi, migliorano il rapporto senza indebolire la filiale.","src":"Banking Game: modello gestionale e debriefing dei round","opts":["Il rapporto tra costi e ricavi della filiale: si migliora soprattutto tagliando i costi, perché sono la parte che controllo direttamente","Il rapporto tra costi operativi e ricavi: si migliora riducendo i costi ma anche aumentando i ricavi per addetto, con mix, prezzi e produttività","Il rapporto tra costo del rischio e margine di intermediazione: si migliora riducendo le perdite attese sul portafoglio crediti","Il rapporto tra costi del personale e numero di dipendenti: si migliora riducendo l'organico o spostando attività su altre strutture della banca"],"a":1,"wy":{"opt":["Incompleta: la definizione è corretta, ma ridurre il rapporto solo con i tagli porta a perdere capacità commerciale e ricavi.","Giusta: il rapporto si migliora agendo su entrambi i termini. Spesso la leva più sostenibile è il ricavo per addetto.","Sbagliata: quello è il costo del rischio. Va monitorato, ma non è il cost/income.","Sbagliata: il cost/income è un rapporto con i ricavi, non una misura di costo per dipendente, e ridurre l'organico può peggiorarlo se calano i ricavi."],"trap":"Confondere il cost/income con altri indicatori e vederlo solo come un problema di costi."}},{"id":"M-04","modulo":"Modello gestionale della filiale","t":"single","text":"Nella mia area prevale un segmento di clientela, per esempio le piccole imprese. Quali implicazioni ha sulla filiale e come posso sviluppare altri segmenti?","why":"Un segmento prevalente concentra ricavi e rischio: la qualità del credito di quel segmento condiziona il risultato. Svilupparne altri non è una questione di prezzo ma di piano: competenze, offerta, tempo commerciale e pazienza, perché le relazioni si costruiscono lentamente.","src":"Banking Game: modello gestionale e debriefing dei round","opts":["Conviene concentrare tutto sul segmento prevalente: è lì che c'è il mercato, che la filiale ha già relazioni e che si ottiene il risultato più rapido","Ricavi e rischio sono concentrati e servono competenze e tempo coerenti; altri segmenti richiedono un piano dedicato di offerta, competenze e tempo, con tempi lunghi","Basta praticare prezzi più bassi sugli altri segmenti: il prezzo è la leva che attrae più rapidamente clienti nuovi senza cambiare l'organizzazione","Il segmento prevalente va ridotto in fretta per diversificare il rischio, spostando subito il tempo commerciale sugli altri segmenti"],"a":1,"wy":{"opt":["Incompleta: concentrarsi è efficiente nel breve ma lascia ricavi e rischio dipendenti da un solo segmento.","Giusta: si riconosce la concentrazione, si presidia il rischio del segmento prevalente e si costruisce un piano per gli altri.","Sbagliata: il prezzo da solo non crea relazioni e riduce il margine. Servono offerta e competenze adatte.","Sbagliata: smantellare la base che produce il risultato espone al rischio di perdere ricavi prima che i nuovi segmenti rendano."],"trap":"Trattare lo sviluppo di nuovi segmenti come un problema di prezzo o di velocità, invece che di competenze, offerta e tempo dedicato."}},{"id":"M-05","modulo":"Modello gestionale della filiale","t":"single","text":"Una parte rilevante del tempo commerciale della filiale è assorbita dalle campagne della banca. Con quale logica pianifico le altre attività?","why":"Il tempo è la risorsa scarsa. Dopo le attività vincolate (campagne), si assegna il tempo residuo dove riduce di più il gap tra budget e risultati, tenendo conto di quanto rende ogni ora su ciascun prodotto e segmento e di chi sa fare meglio cosa.","src":"Giorno 2 · Pianificazione operativa; Banking Game: modello gestionale","opts":["Distribuendo il tempo che resta in modo uniforme tra prodotti e segmenti, per non trascurare nessuna opportunità e mantenere un presidio equilibrato su tutta la clientela","Sulla base dei gap tra budget e risultati da colmare, dei prodotti e dei segmenti in cui ogni ora rende di più, delle competenze delle persone e delle attività già vincolate","Seguendo le richieste dei clienti nel corso della settimana: la domanda reale indica dove c'è più opportunità e dove conviene dedicare tempo e attenzione","Concentrandolo sulle attività in cui le persone si sentono più sicure, per massimizzare la resa e ridurre errori e tempi di apprendimento della squadra"],"a":1,"wy":{"opt":["Sbagliata: l'equidistribuzione ignora che alcune attività chiudono divari più grandi e che i rendimenti sono diversi.","Giusta: gap tra budget e risultati, resa per ora, competenze e vincoli. È la logica della pianificazione operativa.","Sbagliata: lavorare per reazione sacrifica le attività importanti non urgenti. Si può lasciare spazio alle richieste, ma non è un criterio di pianificazione.","Incompleta: sfruttare i punti di forza ha senso, ma non basta se le attività più utili agli obiettivi sono altre."],"trap":"Distribuire il tempo senza partire dagli obiettivi e dai divari, per abitudine, per equità o per reazione."}},{"id":"M-06","modulo":"Modello gestionale della filiale","t":"single","text":"Un collaboratore ha buone potenzialità ma poca esperienza sul credito. Quali attività posso decidere per svilupparlo, e come le combino?","why":"Sviluppare una persona richiede più leve insieme: formazione per le basi, affiancamento per trasferire il modo di lavorare, delega progressiva per assumersi responsabilità man mano che dimostra di esserne capace, e feedback per correggere. L'inserimento di persone esperte è un'altra leva, ma non sostituisce lo sviluppo di chi c'è.","src":"Giorno 2 · Delega e sviluppo dei collaboratori","opts":["Un corso di formazione sul credito per dargli le basi tecniche: l'esperienza e la sicurezza arriveranno poi con il lavoro quotidiano","Affidargli subito le pratiche più importanti: si impara meglio con responsabilità piena e il confronto con la realtà accelera la crescita","Combinare formazione mirata, affiancamento su pratiche reali e delega progressiva di pratiche sempre più complesse, con feedback regolare","Lasciare che maturi con l'esperienza e intanto inserire una persona già esperta sul credito, che gestisca le pratiche più delicate"],"a":2,"wy":{"opt":["Incompleta: la teoria da sola non basta. Senza affiancamento e pratica guidata le competenze non si consolidano.","Sbagliata: responsabilità piena subito, senza supporto, espone la persona e la filiale a errori e può minare la fiducia.","Giusta: formazione, affiancamento, delega progressiva e feedback si rafforzano a vicenda.","Incompleta: l'esperienza non guidata è lenta e disomogenea. L'inserimento di un esperto può aiutare, ma non svolge il compito dello sviluppo."],"trap":"Pensare che lo sviluppo dipenda da una sola attività, o dal solo passare del tempo."}},{"id":"M-07","modulo":"Modello gestionale della filiale","t":"single","text":"Come incide il profilo di competenze delle persone sulle attività da assegnare e sulla motivazione?","why":"Competenze, attività e motivazione sono collegate. Assegnare solo ciò che si sa già fare rende nel breve ma non fa crescere. Assegnare compiti troppo alti senza supporto genera ansia e errori. L'equilibrio è una sfida progressiva con affiancamento.","src":"Giorno 2 · Delega e sviluppo dei collaboratori; Banking Game: modello gestionale","opts":["Conviene dare a ciascuno ciò che sa fare meglio: così rende al massimo, sbaglia meno ed è più motivato, perché lavora nella sua zona di sicurezza","Le attività vanno coerenti con il profilo: troppo facili annoiano, troppo difficili senza supporto frustrano; una sfida graduale con supporto rende e motiva","Conviene assegnare compiti superiori alle competenze: la sfida stimola la crescita e la motivazione arriva di conseguenza, anche se all'inizio si sbaglia","Il profilo conta poco: conta distribuire i carichi in modo equo tra le persone, per evitare tensioni e sensazioni di favoritismo nel team"],"a":1,"wy":{"opt":["Incompleta: è efficiente nel breve ma blocca lo sviluppo e alla lunga demotiva chi non cresce.","Giusta: coerenza con il profilo, sfida graduale e supporto. È la logica della delega progressiva.","Incompleta: la sfida motiva solo se la persona ha i mezzi per affrontarla. Senza supporto produce errori e sfiducia.","Sbagliata: l'equità dei carichi è importante, ma non sostituisce la coerenza tra compiti e competenze, né spiega la motivazione."],"trap":"Ragionare solo in termini di resa immediata o di equità, senza considerare che le attività assegnate cambiano le competenze e la motivazione."}},{"id":"P-01","modulo":"Pianificazione e programmazione","t":"single","text":"Che cosa significa pianificare a ritroso (reverse planning) un obiettivo di fine anno?","why":"Il reverse planning parte dal risultato da raggiungere e torna indietro: cosa serve a ogni tappa, con quali leve (al massimo poche), a partire dai valori attuali. Rende visibile subito il divario e permette di correggere in corsa.","src":"Giorno 1 · Esercizio sulla strategia (reverse planning)","opts":["Partire dai risultati attuali e proiettarli in avanti con il trend, per vedere dove si arriva a fine anno se non cambia nulla","Partire dal traguardo e tornare indietro: traguardi intermedi per periodo e poche leve decisive, a partire dai numeri di oggi","Fissare l'obiettivo finale e decidere periodo per periodo cosa fare, in base a come evolvono i risultati e le condizioni di mercato","Dividere l'obiettivo in parti uguali tra i periodi, assegnando a ciascuno lo stesso incremento da raggiungere, per semplicità di controllo"],"a":1,"wy":{"opt":["Sbagliata: è la proiezione, il contrario. Mostra dove si arriva se non si cambia nulla, non dove si vuole arrivare.","Giusta: dal traguardo indietro, con tappe intermedie e poche leve incisive.","Incompleta: decidere strada facendo senza tappe intermedie toglie il metro per capire se si è in linea.","Incompleta: le tappe uguali sono comode ma spesso irrealistiche, perché gli effetti di formazione e organico arrivano con ritardo."],"trap":"Confondere la pianificazione a ritroso con una proiezione del presente o con una divisione lineare dell'obiettivo."}},{"id":"P-02","modulo":"Pianificazione e programmazione","t":"single","text":"Ho deciso di spostare tempo commerciale dalla raccolta agli impieghi. Che cosa trasforma questa decisione, cioè la pianificazione, in programmazione?","why":"La pianificazione stabilisce dove mettere tempo e risorse per raggiungere gli obiettivi. La programmazione la porta nell'agenda: chi fa cosa, entro quando, con quali verifiche. È il passaggio chiesto al direttore («riempire la propria agenda di attività pianificate e supportare i collaboratori a fare lo stesso») ed è la logica del PPA.","src":"Giorno 1 · Ruolo del direttore; Giorno 2 · PPA","opts":["Comunicarla con chiarezza al team, spiegandone le ragioni e il vantaggio atteso, così che tutti la condividano e la applichino","Tradurla in attività con date e responsabili, nell'agenda di ciascuno, con momenti di verifica dell'avanzamento","Fissare un obiettivo numerico per ogni persona sulla nuova priorità e controllarlo a fine periodo, premiando chi lo raggiunge","Predisporre un report mensile dei risultati per misurare l'effetto della decisione e correggere il tiro quando serve"],"a":1,"wy":{"opt":["Incompleta: spiegare è necessario, ma senza attività, date e responsabili la decisione resta un'intenzione.","Giusta: attività, date, responsabili, agenda e verifica.","Incompleta: un obiettivo per persona dà una direzione, ma senza le attività e i tempi non c'è un programma, e controllare solo a fine periodo è tardi.","Incompleta: misurare è utile, ma è controllo, non programmazione."],"trap":"Fermarsi alla decisione o alla misura dei risultati, senza stabilire chi fa che cosa, quando e come si verifica."}},{"id":"T-01","modulo":"Tempo e priorità","t":"single","text":"Da che cosa dipende l'importanza di un'attività?","why":"L'importanza dipende dal contributo agli obiettivi: risultati commerciali ed economici e soddisfazione dei clienti. L'urgenza dipende da quando va fatta. Confonderle porta a occuparsi di ciò che scade e a trascurare ciò che conta. Nella matrice di Eisenhower l'importante non urgente si pianifica.","src":"Giorno 1 · La matrice di Eisenhower e La settimana infernale","opts":["Dalla scadenza: più è vicina, più l'attività è importante, perché il rischio di non rispettarla cresce e con esso le conseguenze","Dal contributo che fornisce agli obiettivi: risultati commerciali ed economici e soddisfazione dei clienti, indipendentemente dalla sua urgenza","Da chi la richiede: se arriva dal capo o da un cliente importante è prioritaria, perché da quella relazione dipendono i risultati","Dal tempo che richiede: le attività lunghe e complesse assorbono più risorse e quindi pesano di più sul risultato della filiale"],"a":1,"wy":{"opt":["Sbagliata: è l'urgenza. Una scadenza vicina dice quando, non quanto conta.","Giusta: l'importanza dipende dal contributo a risultati commerciali ed economici e alla soddisfazione dei clienti, a prescindere dall'urgenza.","Incompleta: chi chiede segnala a volte un'importanza, ma una richiesta non è importante per il solo fatto di arrivare da qualcuno.","Sbagliata: la durata dice quanta risorsa serve, non quanto contribuisce al risultato."],"trap":"Scambiare l'urgenza, o l'insistenza di chi chiede, per importanza."}},{"id":"T-02","modulo":"Tempo e priorità","t":"single","text":"Che cosa significa se nella mia filiale ci sono sempre attività urgenti?","why":"Un'urgenza continua è quasi sempre il sintomo di attività importanti che non sono state pianificate e programmate in tempo, e di un direttore assorbito dall'esecuzione. Si cura pianificando in anticipo, programmando in agenda e delegando.","src":"Giorno 1 · Gestione del tempo; Giorno 2 · Ostacoli alla delega (il trapezio infernale)","opts":["Che i clienti sono esigenti e il carico di lavoro è semplicemente alto rispetto alle persone disponibili in filiale","Che probabilmente lavoro in emergenza: le attività importanti non sono pianificate in tempo e diventano urgenti, e il direttore è assorbito dall'esecuzione","Che il team è reattivo e dà il meglio sotto pressione: l'urgenza mantiene alta l'attenzione e la velocità di risposta ai clienti","Che la direzione impone scadenze troppo strette: vanno rinegoziate per avere il tempo di lavorare con la qualità richiesta"],"a":1,"wy":{"opt":["Incompleta: il carico esiste, ma spiega poco. Con lo stesso carico, una filiale che pianifica vive meno emergenze.","Giusta: urgenza continua significa assenza di pianificazione e programmazione, e tempo del direttore sull'esecuzione.","Sbagliata: la reattività è una qualità, ma lavorare sempre sotto pressione logora, riduce la qualità e non lascia spazio a ciò che è importante.","Incompleta: a volte la causa è esterna, ma attribuirla sempre alla direzione evita di guardare alla pianificazione della filiale."],"trap":"Attribuire l'urgenza continua a cause esterne, invece di leggerla come segnale di scarsa pianificazione e delega."}},{"id":"D-01","modulo":"Delega e sviluppo dei collaboratori","t":"multi","text":"Quali di queste sono tra le ragioni che, secondo le ricerche viste in aula, impediscono ai responsabili di delegare?","why":"Le ricerche indicano dieci ragioni ricorrenti: tra queste, il tempo che serve per spiegare e controllare, l'abitudine di fare da soli e il giudizio che il collaboratore non sia all'altezza. Il regolamento non c'entra.","src":"Giorno 2 · Gli ostacoli alla delega, sl. 3","opts":["Delegare porta via tempo","Ce l'ho sempre fatta da solo","Lui o lei non è all'altezza, non è maturo","Il regolamento di filiale vieta di delegare","I collaboratori hanno già troppo tempo libero"],"a":[0,1,2],"wy":{"opt":["Giusta: è un ostacolo classico. Spiegare e controllare richiede tempo all'inizio, ma poi libera più tempo di quanto ne costi.","Giusta: l'abitudine di fare da soli porta a pensare di non averne bisogno e a continuare così.","Giusta: spesso è un giudizio più che un fatto. Giuseppe, nel caso visto, non ha mai dato a Dino la possibilità di dimostrarlo.","Sbagliata: non è tra le ragioni emerse dalle ricerche. Non c'è un divieto: è una scelta del responsabile.","Sbagliata: non è una ragione tipica. Anzi, chi non delega tende a sovraccaricare sé stesso."],"trap":"Cercare l'ostacolo fuori (regole, carichi) quando le ricerche mostrano che nascono quasi sempre dalle abitudini e dai timori del responsabile."}},{"id":"D-02","modulo":"Delega e sviluppo dei collaboratori","t":"single","text":"Giuseppe è responsabile di filiale da poche settimane. Rilegge e riscrive le istruttorie che prepara Dino, l'addetto fidi, perché teme errori in delibera; dice che non ha tempo per insegnare e che delegherà più avanti. Dino ha smesso di chiedere. Che cosa dovrebbe fare Giuseppe?","why":"La risposta esatta è la terza: delega progressiva. Giuseppe sposta il controllo dal rifare il lavoro al definire il risultato atteso, dare istruzioni e tempo, concordare le verifiche e dare feedback. Accetta che Dino impari anche dagli errori, in un perimetro che può governare. Così libera tempo per le attività del suo ruolo.","src":"Giorno 2 · Il caso di Giuseppe e autotest sulla delega","opts":["Continuare a rileggere ogni istruttoria prima della delibera, spiegando a Dino gli errori che trova: così impara e il rischio in delibera resta sotto controllo fino a quando non sarà più autonomo","Affidare subito a Dino anche le istruttorie più importanti, per metterlo alla prova e responsabilizzarlo: se ha le basi, imparerà in fretta sul campo, con l'esperienza diretta della delibera","Delegare in modo progressivo: partire da istruttorie di importo contenuto, con istruzioni, tempi, verifiche concordate e feedback, e crescere in complessità senza rifare il lavoro di Dino","Rimandare la delega finché non si sente più sicuro nel proprio ruolo e ha il tempo per insegnare a Dino tutto quello che serve sapere sul credito e sulla delibera"],"a":2,"wy":{"opt":["Incompleta: spiegare gli errori è meglio che tacere, ma finché Giuseppe controlla tutto Dino non si assume responsabilità e il carico di Giuseppe non cala.","Sbagliata: dare tutto subito, senza gradualità e senza supporto, espone Dino e la filiale a rischi e può minare la fiducia.","Giusta: delega progressiva con istruzioni, tempi, verifiche e feedback.","Sbagliata: è la posizione che Giuseppe sostiene, ma rimandare mantiene il problema: più aspetta, più carico accumula e meno Dino cresce."],"trap":"Credere che per non sbagliare convenga fare tutto da soli o rimandare, senza vedere che il costo è nel carico del responsabile e nella crescita del collaboratore."}},{"id":"D-03","modulo":"Delega e sviluppo dei collaboratori","t":"single","text":"Che cosa distingue una delega efficace da una semplice assegnazione di compiti?","why":"Assegnare un compito dice solo cosa fare. Delegare significa trasferire un risultato da ottenere con l'autonomia per decidere come, la responsabilità e un modo concordato per verificare. Per questo la delega sviluppa le persone e libera il direttore dall'esecuzione.","src":"Giorno 2 · La delega ai collaboratori e autotest","opts":["Il fatto che il compito sia complesso: si delega ciò che è difficile e richiede esperienza, mentre la routine resta in capo al direttore","Si trasferiscono risultato atteso, autonomia di decisione e responsabilità, con verifiche concordate: fa crescere la persona e libera tempo per il ruolo di direzione","Il controllo continuo del lavoro svolto, così il direttore resta sempre in grado di intervenire sul risultato prima che sia troppo tardi","La scelta del collaboratore più esperto, così il rischio di errore è minimo e il direttore può fidarsi senza dover verificare"],"a":1,"wy":{"opt":["Sbagliata: la complessità non definisce la delega. Si delega anche per sviluppare, partendo da compiti alla portata.","Giusta: risultato atteso, autonomia, responsabilità, verifiche concordate.","Sbagliata: il controllo continuo è il contrario: toglie autonomia e non libera tempo.","Incompleta: scegliere persone adatte è utile, ma delegare solo agli esperti non sviluppa gli altri."],"trap":"Confondere delegare con distribuire compiti, o con farli eseguire sotto controllo continuo."}},{"id":"O-01","modulo":"Obiettivi SMART e gestione delle persone","t":"single","text":"Devo assegnare a un collaboratore l'obiettivo «migliorare il servizio ai clienti». Come lo rendo SMART?","why":"Un obiettivo SMART è specifico (che cosa), misurabile (indicatore con valore di partenza e di arrivo), ambizioso ma raggiungibile con risorse e competenze, e tempificato. Un esempio di riscrittura: entro un anno ridurre i reclami da 212 a meno di 100 e le chiusure di conto da 32 a meno di 11.","src":"Giorno 2 · Goal setting ed esercitazione sugli obiettivi","opts":["Aggiungendo un numero di miglioramento e una data, così l'obiettivo diventa misurabile e il collaboratore sa entro quando deve arrivarci","Con un indicatore misurabile, un valore di partenza e uno di arrivo ambizioso ma raggiungibile con risorse e competenze della persona, e una scadenza","Fissandolo molto alto, così il collaboratore dà il massimo anche se non lo raggiunge: l'ambizione conta più del risultato","Elencando le attività che il collaboratore svolgerà nel periodo, in modo che sappia cosa fare ogni settimana per migliorare il servizio"],"a":1,"wy":{"opt":["Incompleta: numero e data sono necessari, ma senza un indicatore specifico e un valore realistico l'obiettivo resta arbitrario.","Giusta: indicatore, partenza e arrivo, ambizione raggiungibile, scadenza.","Sbagliata: obiettivi irraggiungibili riducono la prestazione invece di aumentarla. Devono essere difficili ma raggiungibili.","Sbagliata: è l'errore di confondere attività e obiettivi: le attività sono il come, non il risultato atteso."],"trap":"Scambiare una dichiarazione di intenti, o un elenco di attività, per un obiettivo misurabile."}},{"id":"O-02","modulo":"Obiettivi SMART e gestione delle persone","t":"multi","text":"Assegno obiettivi ai collaboratori. Quali di queste pratiche indeboliscono l'efficacia degli obiettivi?","why":"Tra le cose da non fare nel goal setting ci sono: obiettivi senza risorse e informazioni, confondere attività e obiettivi, non avere il piano per raggiungerli, non dare feedback intermedi, non valutare i comportamenti. Frazionare l'obiettivo nel tempo e valutare anche i comportamenti sono invece buone pratiche.","src":"Giorno 2 · Goal setting, le cose da non fare","opts":["Non dare feedback intermedi lungo il percorso","Assegnare un obiettivo senza risorse e strumenti adeguati","Indicare attività da svolgere al posto del risultato atteso","Frazionare l'obiettivo in tappe intermedie","Valutare anche i comportamenti con cui si raggiunge il risultato"],"a":[0,1,2],"wy":{"opt":["Giusta come pratica che indebolisce: senza feedback la persona non sa se è in linea e non corregge in tempo.","Giusta come pratica che indebolisce: l'obiettivo senza mezzi è un obiettivo che si perde in partenza.","Giusta come pratica che indebolisce: l'obiettivo è il risultato atteso, le attività sono il come.","Non indebolisce: è una buona pratica. Obiettivi misurabili e frazionati nel tempo si seguono meglio.","Non indebolisce: è una buona pratica. Il fine non giustifica i mezzi."],"trap":"Giudicare gli obiettivi solo dal numero finale, senza guardare risorse, piano, feedback e comportamenti."}}]}];

  else {
    h += `<div class="card"><h2>Quadro riassuntivo</h2><div class="db-top">${donut(ok, n)}<div class="db-kpi"><div><b>${subs.length}</b><span>partecipanti (prima consegna)</span></div><div><b>${avg === null ? '—' : Math.round(avg * 100) + '%'}</b><span>punteggio medio</span></div><div><b>${bad.length} su ${per.length}</b><span>domande con almeno un errore</span></div><div><b>${good.length}</b><span>domande giuste per tutti</span></div></div></div></div>
    <div class="card"><h2>Classifica delle domande</h2><p class="small">Dalla più sbagliata alla meno sbagliata. La barra rossa è la quota di partecipanti che ha sbagliato.</p>${rank.map((x) => rankBar(shorten(x.q.text, 90), x.q.id, x.wrong, x.n)).join('')}</div>${mods}`;
    if (bad.length) h += `<div class="db-head"><h2>Debriefing, domanda per domanda</h2><div class="noprint"><button class="btn small" id="oa">Apri tutte</button> <button class="btn small" id="ca">Chiudi tutte</button></div></div><p class="small">Dalla più sbagliata. Per ogni domanda: come hanno risposto, la risposta giusta con la spiegazione e perché le altre sono sbagliate.</p>${bad.map((x, i) => qCard(x, i + 1, i < 2)).join('')}`;
    else h += `<div class="card"><b>Nessuna domanda sbagliata: tutti hanno risposto giusto a tutto.</b></div>`;
    if (good.length) h += `<details class="db-card"><summary class="db-sum db-sum2"><span class="db-rank ok">✓</span><span class="db-sumt"><b>Domande giuste per tutti (${good.length})</b></span></summary><div class="db-body">${good.map((x) => `<div class="db-gq"><b>${esc(x.q.id)}</b> ${esc(shorten(x.q.text, 130))}<br><span class="small">Risposta corretta: ${esc(shorten(correctText(x.q), 160))}</span></div>`).join('')}</div></details>`;
  }
  $('#app').innerHTML = h + statsTools();
  bindStats();
}
/* ---------- avvio ---------- */
$('#hbtn').onclick = () => { S.view = 'home'; render(); };
(function init() {
  const p = new URLSearchParams(location.search), e = (p.get('e') || '').toUpperCase().replace(/[^A-Z0-9_-]/g, '');
  const last = LS.get('bgv:last', {});
  if (e) enter(e); else if (last.edition) { S.edition = last.edition; enter(last.edition); } else { S.view = 'start'; render(); }
})();
</script>
